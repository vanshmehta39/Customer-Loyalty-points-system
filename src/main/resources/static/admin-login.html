<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login - LoyaltyHub</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 80%);
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: var(--radius-xl);
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 48px; height: 48px; margin: 0 auto 0.75rem; background: linear-gradient(135deg, #8b5cf6, #ec4899); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);">
                    🛡️
                </div>
                <h1 style="font-size: 1.75rem; margin-bottom: 0.35rem;">Admin Portal</h1>
                <p style="color: var(--text-secondary); font-size: 0.875rem;">Loyalty Program Management & Analytics</p>
            </div>

            <div style="background: rgba(139, 92, 246, 0.1); border: 1px dashed rgba(139, 92, 246, 0.3); border-radius: var(--radius-md); padding: 0.75rem; margin-bottom: 1.5rem; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <strong>Demo Admin:</strong><br>
                    <span style="color: var(--text-secondary);">admin@loyalty.com / admin123</span>
                </div>
                <button type="button" class="btn btn-outline btn-sm" onclick="fillAdminDemo()">Auto-Fill</button>
            </div>

            <form id="admin-login-form">
                <div class="form-group">
                    <label class="form-label" for="admin-email">Admin Email</label>
                    <input type="email" id="admin-email" class="form-control" placeholder="admin@loyalty.com" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="admin-password">Password</label>
                    <input type="password" id="admin-password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-accent btn-block btn-lg" id="submit-btn" style="margin-top: 1.5rem;">
                    Authenticate as Admin &rarr;
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem;">
                <a href="/login.html" style="color: var(--text-muted);">&larr; Return to Customer Login</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        function fillAdminDemo() {
            document.getElementById('admin-email').value = 'admin@loyalty.com';
            document.getElementById('admin-password').value = 'admin123';
        }

        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Verifying Credentials...';

            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;

            try {
                const res = await apiRequest('/auth/admin-login', 'POST', { email, password });
                if (res.success && res.data) {
                    Auth.setUser(res.data);
                    showToast('Admin authorized! Loading control center...');
                    setTimeout(() => {
                        window.location.href = '/admin-dashboard.html';
                    }, 600);
                }
            } catch (err) {
                showToast(err.message || 'Admin login failed.', 'error');
                btn.disabled = false;
                btn.textContent = 'Authenticate as Admin →';
            }
        });
    </script>
</body>
</html>
