<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - LoyaltyHub</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        .notif-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            transition: var(--transition);
        }
        .notif-card.unread {
            border-left: 4px solid var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }
        .notif-icon-circle {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container" style="padding: 2.5rem 1.5rem 5rem; max-width: 900px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h1 style="font-size: 2.2rem; margin-bottom: 0.35rem;">Notifications Center</h1>
                <p style="color: var(--text-secondary);">Updates regarding your points, tier changes, and promotional deals.</p>
            </div>
            <button type="button" class="btn btn-outline btn-sm" onclick="markAllRead()">
                ✓ Mark All as Read
            </button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 1rem;" id="notifications-container">
            <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
                Loading notifications...
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container" style="text-align: center;">
            <p>&copy; 2026 LoyaltyHub. College Project - Customer Loyalty Points System.</p>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.requireAuth('CUSTOMER')) return;
            await loadNotifications();
        });

        async function loadNotifications() {
            const user = Auth.getUser();
            const container = document.getElementById('notifications-container');

            try {
                const res = await apiRequest(`/notifications?userId=${user.id}`);
                if (!res.success || !res.data || res.data.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
                            <div style="font-size: 3rem; margin-bottom: 1rem;">🔔</div>
                            <h3>No notifications yet</h3>
                            <p style="margin-top: 0.5rem;">You will receive alerts when points are earned or rewards redeemed.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = res.data.map(n => {
                    let icon = '🔔';
                    if (n.type === 'TIER_UPGRADE') icon = '👑';
                    else if (n.type === 'POINTS_EARNED') icon = '🛍️';
                    else if (n.type === 'REWARD_REDEEMED') icon = '🎁';
                    else if (n.type === 'BONUS') icon = '✨';

                    return `
                        <div class="notif-card ${!n.isRead ? 'unread' : ''}">
                            <div style="display: flex; gap: 1rem; align-items: flex-start;">
                                <div class="notif-icon-circle">${icon}</div>
                                <div>
                                    <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                                        <h3 style="font-size: 1.05rem; color: #fff;">${escapeHtml(n.title)}</h3>
                                        ${!n.isRead ? `<span class="badge badge-primary" style="font-size: 0.65rem;">NEW</span>` : ''}
                                    </div>
                                    <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5;">${escapeHtml(n.message)}</p>
                                    <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;">${formatDate(n.createdAt)}</div>
                                </div>
                            </div>
                            <div>
                                ${!n.isRead ? `
                                    <button type="button" class="btn btn-outline btn-sm" onclick="markSingleRead(${n.id})">Mark read</button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                container.innerHTML = `<div style="text-align: center; color: var(--danger); padding: 2rem;">Error: ${err.message}</div>`;
            }
        }

        async function markSingleRead(id) {
            const user = Auth.getUser();
            try {
                await apiRequest(`/notifications/${id}/read?userId=${user.id}`, 'PUT');
                await loadNotifications();
                syncLiveNavState(user.id);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function markAllRead() {
            const user = Auth.getUser();
            try {
                await apiRequest(`/notifications/read-all?userId=${user.id}`, 'PUT');
                showToast('All notifications marked as read.');
                await loadNotifications();
                syncLiveNavState(user.id);
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.toString().replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
