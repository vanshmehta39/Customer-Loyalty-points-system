<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - LoyaltyHub</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .auth-wrapper {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 2.25rem 1.75rem;
            box-shadow: var(--shadow-lg);
        }
        .demo-box {
            background: var(--bg-surface-alt);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.9rem 1rem;
            margin-bottom: 1.4rem;
            font-size: 0.84rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }
        .brand-mark {
            width: 44px;
            height: 44px;
            margin: 0 auto 0.85rem;
            border-radius: 12px;
            background: var(--primary);
            color: var(--text-inverse);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <div class="brand-mark">L</div>
                <h1 style="font-size: 2rem; margin-bottom: 0.3rem;">Welcome back</h1>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">Sign in to view your points and rewards.</p>
            </div>

            <div class="demo-box">
                <div>
                    <strong>Demo account</strong><br>
                    <span style="color: var(--text-secondary);">customer@loyalty.com / customer123</span>
                </div>
                <button type="button" class="btn btn-outline btn-sm" onclick="fillDemoCustomer()">Fill</button>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-email">Email address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>

                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.4rem; font-size: 0.85rem; gap: 1rem;">
                    <label style="display: flex; align-items: center; gap: 0.55rem; cursor: pointer; color: var(--text-secondary);">
                        <input type="checkbox" id="remember-me" checked> Remember me
                    </label>
                    <a href="javascript:void(0)" onclick="showToast('Use the demo password: customer123 or reset it in the admin panel.', 'warning')">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Sign in</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
                Need an account? <a href="/register.html" style="font-weight: 700;">Create one</a>
            </div>

            <div style="text-align: center; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color); font-size: 0.85rem;">
                Admin access: <a href="/admin-login.html" style="font-weight: 700;">Admin Login</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        function fillDemoCustomer() {
            document.getElementById('login-email').value = 'customer@loyalty.com';
            document.getElementById('login-password').value = 'customer123';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Authenticating...';

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const rememberMe = document.getElementById('remember-me').checked;

            try {
                const res = await apiRequest('/auth/login', 'POST', { email, password, rememberMe });
                if (res.success && res.data) {
                    Auth.setUser(res.data);
                    showToast('Login successful. Redirecting to your dashboard...');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 800);
                }
            } catch (err) {
                showToast(err.message || 'Login failed. Please check credentials.', 'error');
                btn.disabled = false;
                btn.textContent = 'Sign in';
            }
        });
    </script>
</body>
</html>
