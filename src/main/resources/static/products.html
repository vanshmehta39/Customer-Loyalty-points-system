<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop & Earn 10% Points - LoyaltyHub</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container" style="padding: 2.5rem 1.5rem 4rem;">
        <!-- Page Header -->
        <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;">
            <div>
                <h1 style="font-size: 2.2rem; margin-bottom: 0.35rem;">Explore Products</h1>
                <p style="color: var(--text-secondary);">Every order earns approximately <strong style="color: #34d399;">10% Loyalty Points</strong> automatically credited to your balance.</p>
            </div>
            <a href="/cart.html" class="btn btn-primary" id="floating-cart-btn">
                🛒 View Shopping Cart (<span id="cart-item-count">0</span>)
            </a>
        </div>

        <!-- Search & Filter Controls -->
        <div class="card" style="padding: 1.25rem 1.5rem; margin-bottom: 2rem;">
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 260px; position: relative;">
                    <input type="text" id="search-input" class="form-control" placeholder="Search by name, brand, or feature..." style="padding-left: 2.5rem;">
                    <span style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);">🔍</span>
                </div>
                <div style="display: flex; gap: 0.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="resetFilters()">Reset</button>
                </div>
            </div>

            <!-- Category Pills -->
            <div class="filter-pills" id="category-pills" style="margin-top: 1.25rem; margin-bottom: 0;">
                <button type="button" class="filter-pill active" onclick="setCategory('All')">All Categories</button>
                <button type="button" class="filter-pill" onclick="setCategory('Electronics')">Electronics</button>
                <button type="button" class="filter-pill" onclick="setCategory('Fashion')">Fashion</button>
                <button type="button" class="filter-pill" onclick="setCategory('Home')">Home</button>
                <button type="button" class="filter-pill" onclick="setCategory('Accessories')">Accessories</button>
                <button type="button" class="filter-pill" onclick="setCategory('Lifestyle')">Lifestyle</button>
            </div>
        </div>

        <!-- Products Grid -->
        <div class="grid-4" id="products-grid">
            <div style="grid-column: span 4; text-align: center; padding: 4rem; color: var(--text-muted);">
                Loading available products...
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container" style="text-align: center;">
            <p>&copy; 2026 LoyaltyHub. College Project - Customer Loyalty Points System.</p>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script src="/js/products.js"></script>
</body>
</html>
