<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account - LoyaltyHub</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .auth-wrapper {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
        }
        .auth-card {
            width: 100%;
            max-width: 620px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 2.25rem 2rem;
            box-shadow: var(--shadow-lg);
        }
        .brand-mark {
            width: 44px;
            height: 44px;
            margin: 0 auto 0.8rem;
            border-radius: 12px;
            background: var(--primary);
            color: var(--text-inverse);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 1.8rem;">
                <div class="brand-mark">L</div>
                <h1 style="font-size: 2rem; margin-bottom: 0.35rem;">Create your account</h1>
                <p style="color: var(--text-secondary); font-size: 0.95rem;">Join the loyalty program and start earning on every purchase.</p>
            </div>

            <form id="register-form">
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label" for="reg-fullname">Full name *</label>
                        <input type="text" id="reg-fullname" class="form-control" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-email">Email address *</label>
                        <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label" for="reg-password">Password *</label>
                        <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-confirm-password">Confirm password *</label>
                        <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label" for="reg-phone">Phone number</label>
                        <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-city">City</label>
                        <input type="text" id="reg-city" class="form-control" placeholder="Mumbai, Pune, Delhi">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label" for="reg-dob">Date of birth</label>
                        <input type="date" id="reg-dob" class="form-control">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-referral">Referral code</label>
                        <input type="text" id="reg-referral" class="form-control" placeholder="LOYAL-XXXXX">
                    </div>
                </div>

                <div style="margin: 1.25rem 0 1.5rem;">
                    <label style="display: flex; align-items: flex-start; gap: 0.6rem; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">
                        <input type="checkbox" id="terms-check" required style="margin-top: 0.2rem;">
                        <span>I agree to the terms of service and loyalty program enrollment.</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Create account</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
                Already have an account? <a href="/login.html" style="font-weight: 700;">Sign in</a>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');

            const fullName = document.getElementById('reg-fullname').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
            const phone = document.getElementById('reg-phone').value.trim();
            const city = document.getElementById('reg-city').value.trim();
            const birthDate = document.getElementById('reg-dob').value;
            const referralCode = document.getElementById('reg-referral').value.trim();

            if (password !== confirmPassword) {
                showToast('Passwords do not match. Please re-enter.', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                const res = await apiRequest('/auth/register', 'POST', {
                    fullName,
                    email,
                    password,
                    confirmPassword,
                    phone,
                    city,
                    birthDate,
                    referralCode
                });

                if (res.success && res.data) {
                    Auth.setUser(res.data);
                    showToast('Account created successfully. Welcome to LoyaltyHub.');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 900);
                }
            } catch (err) {
                showToast(err.message || 'Registration failed. Try again.', 'error');
                btn.disabled = false;
                btn.textContent = 'Create account';
            }
        });
    </script>
</body>
</html>
