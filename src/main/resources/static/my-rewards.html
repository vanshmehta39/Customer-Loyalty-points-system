<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Rewards & Coupons - LoyaltyHub</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/dashboard.css">
    <style>
        .coupon-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
        }
        .coupon-card.active-coupon {
            border-left: 4px solid var(--primary);
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.05), rgba(17, 24, 39, 0.8));
        }
        .coupon-card.used-coupon {
            opacity: 0.6;
            border-left: 4px solid var(--text-muted);
        }
        .coupon-code-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #1e293b;
            border: 1px dashed #6366f1;
            padding: 0.4rem 0.85rem;
            border-radius: var(--radius-md);
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container" style="padding: 2.5rem 1.5rem 5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;">
            <div>
                <h1 style="font-size: 2.2rem; margin-bottom: 0.35rem;">My Coupons & Vouchers</h1>
                <p style="color: var(--text-secondary);">Manage your redeemed coupons and apply them directly at checkout.</p>
            </div>
            <a href="/rewards.html" class="btn btn-primary">
                🎁 Redeem More Rewards
            </a>
        </div>

        <!-- Filter tabs: Active vs Used -->
        <div style="display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
            <button type="button" class="btn btn-outline active" id="tab-active-btn" onclick="switchTab('ACTIVE')">
                Active Coupons (<span id="active-count">0</span>)
            </button>
            <button type="button" class="btn btn-outline" id="tab-used-btn" onclick="switchTab('USED')">
                Redeemed / Used History
            </button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 1rem;" id="coupons-list">
            <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
                Loading your coupons...
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container" style="text-align: center;">
            <p>&copy; 2026 LoyaltyHub. College Project - Customer Loyalty Points System.</p>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        let currentTab = 'ACTIVE';
        let allCoupons = [];

        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.requireAuth('CUSTOMER')) return;
            const user = Auth.getUser();

            try {
                const res = await apiRequest(`/rewards/my-rewards?userId=${user.id}`);
                if (res.success && res.data) {
                    allCoupons = res.data;
                    const activeCount = allCoupons.filter(c => c.status === 'ACTIVE').length;
                    document.getElementById('active-count').textContent = activeCount;
                    renderCoupons();
                }
            } catch (err) {
                document.getElementById('coupons-list').innerHTML = `<div style="text-align: center; color: var(--danger); padding: 2rem;">Error: ${err.message}</div>`;
            }
        });

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-active-btn').classList.toggle('active', tab === 'ACTIVE');
            document.getElementById('tab-used-btn').classList.toggle('active', tab === 'USED');
            renderCoupons();
        }

        function renderCoupons() {
            const container = document.getElementById('coupons-list');
            const filtered = allCoupons.filter(c => {
                if (currentTab === 'ACTIVE') return c.status === 'ACTIVE';
                return c.status === 'USED' || c.status === 'EXPIRED';
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 4rem 1rem; color: var(--text-muted);">
                        <div style="font-size: 3rem; margin-bottom: 1rem;">🎟️</div>
                        <h3>No ${currentTab.toLowerCase()} coupons found</h3>
                        <p style="margin: 0.5rem 0 1.5rem;">Exchange your loyalty points for discounts in the Rewards Store.</p>
                        <a href="/rewards.html" class="btn btn-accent btn-sm">Explore Rewards Store</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const isActive = item.status === 'ACTIVE';
                const reward = item.reward;

                return `
                    <div class="coupon-card ${isActive ? 'active-coupon' : 'used-coupon'}">
                        <div>
                            <div style="display: flex; align-items: center; gap: 0.6rem;">
                                <span style="font-size: 1.5rem;">${reward.icon || '🎟️'}</span>
                                <h3 style="font-size: 1.2rem; color: #fff;">${escapeHtml(reward.name)}</h3>
                                <span class="badge ${isActive ? 'badge-success' : 'badge-secondary'}">${item.status}</span>
                            </div>

                            <div class="coupon-code-pill">
                                <span>${item.couponCode}</span>
                                <button type="button" onclick="copyCode('${item.couponCode}')" style="background: transparent; border: none; color: #818cf8; cursor: pointer;" title="Copy">📋</button>
                            </div>

                            <div style="font-size: 0.85rem; color: var(--text-secondary);">
                                Redeemed on: ${formatDate(item.redeemedAt)} &bull; 
                                ${isActive ? `Expires: <strong style="color: #fbbf24;">${formatDate(item.expiresAt)}</strong>` : `Used on: ${formatDate(item.usedAt)}`}
                            </div>
                        </div>

                        <div>
                            ${isActive ? `
                                <button type="button" class="btn btn-primary" onclick="useCouponInCart('${item.couponCode}')">
                                    🛒 Use in Cart
                                </button>
                            ` : `
                                <span style="color: var(--text-muted); font-size: 0.85rem;">Completed</span>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code);
            showToast('Coupon code copied to clipboard! 📋');
        }

        function useCouponInCart(code) {
            sessionStorage.setItem('appliedCoupon', code);
            showToast(`Coupon ${code} selected for cart!`);
            setTimeout(() => window.location.href = '/cart.html', 500);
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.toString().replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
