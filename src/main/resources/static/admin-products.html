<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - Admin Portal</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar Navigation -->
        <aside class="admin-sidebar">
            <div class="admin-brand">
                <span style="font-size: 1.5rem;">🛡️</span>
                <div>Admin<span>Hub</span></div>
            </div>

            <ul class="admin-nav">
                <li class="admin-nav-item"><a href="/admin-dashboard.html">📊 Overview Analytics</a></li>
                <li class="admin-nav-item"><a href="/admin-customers.html">👥 Customer Directory</a></li>
                <li class="admin-nav-item"><a href="/admin-products.html" class="active">🛍️ Product Catalog</a></li>
                <li class="admin-nav-item"><a href="/admin-rewards.html">🎁 Loyalty Rewards</a></li>
                <li class="admin-nav-item"><a href="/admin-notifications.html">📢 Broadcast Alerts</a></li>
            </ul>

            <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                <a href="/dashboard.html" class="btn btn-outline btn-block btn-sm" style="margin-bottom: 0.5rem;">⭐ Customer View</a>
                <button type="button" class="btn btn-danger btn-block btn-sm" onclick="Auth.logout()">🚪 Log Out</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="admin-main">
            <header class="admin-topbar">
                <h2 style="font-size: 1.35rem;">Store Catalog & Inventory Management</h2>
                <button type="button" class="btn btn-primary" onclick="openCreateProductModal()">
                    ➕ Add New Product
                </button>
            </header>

            <div class="admin-content">
                <div class="card" style="padding: 0; overflow: hidden;">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Product Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Rating</th>
                                    <th>Stock</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="admin-products-tbody">
                                <tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 3rem;">Loading product catalog...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Product Modal -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-content" style="max-width: 600px;">
            <button type="button" class="modal-close" onclick="closeProductModal()">&times;</button>
            <h3 style="font-size: 1.4rem; margin-bottom: 1.5rem;" id="modal-product-title">Add New Product</h3>

            <form id="product-form">
                <input type="hidden" id="prod-id">

                <div class="form-group">
                    <label class="form-label" for="prod-name">Product Name *</label>
                    <input type="text" id="prod-name" class="form-control" placeholder="e.g. Sony WH-1000XM5" required>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label" for="prod-category">Category *</label>
                        <select id="prod-category" class="form-control" required>
                            <option value="Electronics">Electronics</option>
                            <option value="Fashion">Fashion</option>
                            <option value="Home">Home</option>
                            <option value="Accessories">Accessories</option>
                            <option value="Lifestyle">Lifestyle</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="prod-price">Price (₹) *</label>
                        <input type="number" step="1" min="1" id="prod-price" class="form-control" placeholder="1999" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label" for="prod-stock">Stock Quantity</label>
                        <input type="number" min="0" id="prod-stock" class="form-control" value="100">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="prod-image">Image URL</label>
                        <input type="url" id="prod-image" class="form-control" placeholder="https://images.unsplash.com/...">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="prod-desc">Description</label>
                    <textarea id="prod-desc" class="form-control" rows="3" placeholder="Detailed product specifications..."></textarea>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem;">
                    <button type="button" class="btn btn-outline" onclick="closeProductModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-product-btn">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        let allProducts = [];

        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.requireAuth('ADMIN')) return;
            await loadAdminProducts();

            document.getElementById('product-form').addEventListener('submit', handleSaveProduct);
        });

        async function loadAdminProducts() {
            const tbody = document.getElementById('admin-products-tbody');
            try {
                const res = await apiRequest('/admin/products');
                if (!res.success || !res.data) {
                    tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--danger); padding: 2rem;">Failed to load products.</td></tr>`;
                    return;
                }

                allProducts = res.data;
                tbody.innerHTML = allProducts.map(p => `
                    <tr>
                        <td style="color: var(--text-muted);">#${p.id}</td>
                        <td style="font-weight: 700; color: #fff;">${escapeHtml(p.name)}</td>
                        <td><span class="badge badge-primary">${escapeHtml(p.category)}</span></td>
                        <td style="font-weight: 800; color: #34d399;">${formatINR(p.price)}</td>
                        <td>★ ${p.rating || 4.5} (${p.reviewsCount || 0})</td>
                        <td>${p.stockQuantity}</td>
                        <td>
                            <span class="badge ${p.active ? 'badge-success' : 'badge-danger'}">
                                ${p.active ? 'ACTIVE' : 'INACTIVE'}
                            </span>
                        </td>
                        <td>
                            <div style="display: flex; gap: 0.5rem;">
                                <button type="button" class="btn btn-secondary btn-sm" onclick="openEditProductModal(${p.id})">Edit</button>
                                <button type="button" class="btn btn-outline btn-sm" onclick="toggleProduct(${p.id})">
                                    ${p.active ? 'Deactivate' : 'Activate'}
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--danger); padding: 2rem;">Error: ${err.message}</td></tr>`;
            }
        }

        function openCreateProductModal() {
            document.getElementById('modal-product-title').textContent = 'Add New Product';
            document.getElementById('product-form').reset();
            document.getElementById('prod-id').value = '';
            document.getElementById('product-modal').classList.add('active');
        }

        function openEditProductModal(id) {
            const p = allProducts.find(x => x.id === id);
            if (!p) return;

            document.getElementById('modal-product-title').textContent = 'Edit Product';
            document.getElementById('prod-id').value = p.id;
            document.getElementById('prod-name').value = p.name;
            document.getElementById('prod-category').value = p.category;
            document.getElementById('prod-price').value = p.price;
            document.getElementById('prod-stock').value = p.stockQuantity;
            document.getElementById('prod-image').value = p.imageUrl || '';
            document.getElementById('prod-desc').value = p.description || '';

            document.getElementById('product-modal').classList.add('active');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.remove('active');
        }

        async function handleSaveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const name = document.getElementById('prod-name').value.trim();
            const category = document.getElementById('prod-category').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const stockQuantity = parseInt(document.getElementById('prod-stock').value) || 100;
            const imageUrl = document.getElementById('prod-image').value.trim();
            const description = document.getElementById('prod-desc').value.trim();

            const payload = { name, category, price, stockQuantity, imageUrl, description, active: true };

            try {
                if (id) {
                    await apiRequest(`/admin/products/${id}`, 'PUT', payload);
                    showToast('Product updated successfully!');
                } else {
                    await apiRequest('/admin/products', 'POST', payload);
                    showToast('Product created successfully!');
                }
                closeProductModal();
                await loadAdminProducts();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function toggleProduct(id) {
            try {
                await apiRequest(`/admin/products/${id}/toggle`, 'PATCH');
                showToast('Product status updated.');
                await loadAdminProducts();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.toString().replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
