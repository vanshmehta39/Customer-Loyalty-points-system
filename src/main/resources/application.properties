server.port=8080

# Database Configuration (H2 in-memory by default for local startup; override via ENV or command line args)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:loyalty_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Jackson / JSON formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Static web resources
spring.web.resources.static-locations=classpath:/static/

# Business Logic Configuration
loyalty.points.earn-rate=0.10
loyalty.points.review-bonus=25
loyalty.points.birthday-bonus=100
loyalty.points.referral-bonus=150
loyalty.points.first-purchase-bonus=200
