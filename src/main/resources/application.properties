server.port=8080

# MySQL is the default database. Set SPRING_DATASOURCE_PASSWORD in the environment.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/loyalty_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.MySQLDialect}

# Jackson / JSON formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Static web resources
spring.web.resources.static-locations=classpath:/static/

# Business Logic Configuration
loyalty.points.earn-rate=0.10
loyalty.points.review-bonus=25
loyalty.points.birthday-bonus=100
loyalty.points.referral-bonus=150
loyalty.points.first-purchase-bonus=200
